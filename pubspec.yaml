name: acadia
version: 1.0.0+1
publish_to: none

description: ACADIA - Digital Education Platform for Ethiopian Students

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  
  # HTTP Client
  http: ^1.2.0
  dio: ^5.4.0
  
  # Navigation
  go_router: ^13.0.1
  
  # Backend & Database
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0

  # Logging
  logger: ^2.4.0

  # Gallery / media saving
  gal: ^2.3.0
  
  # Video & PDF
  video_player: ^2.8.1
  chewie: ^1.7.4
  syncfusion_flutter_pdfviewer: ^28.2.7
  pdf: ^3.10.7
  
  # Storage & Local Data
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path: ^1.8.3
  
  # Utils
  url_launcher: ^6.2.2
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  csv: ^6.0.0
  permission_handler: ^11.2.0
  intl: ^0.20.2
  share_plus: ^7.2.1
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  
  # UI Components
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  
  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  
  # Content Rendering
  flutter_markdown: ^0.6.18
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.14.3

# App Icons Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logos/logo.png
  adaptive_icon_background: '#111844'
  adaptive_icon_foreground: assets/logos/logo.png

flutter:
  uses-material-design: true
  
  assets:
    # Images
    - assets/images/
    - assets/images/splash.jpg
    
    # Icons
    - assets/icons/
    - assets/icons/telegram_icon.png
    - assets/icons/facebook_icon.png
    - assets/icons/instagram_icon.jpg
    - assets/icons/twitter_png.png
    - assets/icons/youtube_icon.png
    - assets/icons/tiktok_icon.png
    
    # Subject Icons (19 files)
    - assets/icons/subjects_icon/
    - assets/icons/subjects_icon/Agriculture_icon.jpg
    - assets/icons/subjects_icon/Anthropology_icon.jpg
    - assets/icons/subjects_icon/Applied_math_icon.jpg
    - assets/icons/subjects_icon/Aptitude_icon.jpg
    - assets/icons/subjects_icon/Biology_icon.jpg
    - assets/icons/subjects_icon/C++_icon.jpg
    - assets/icons/subjects_icon/Chemistry_icon.jpg
    - assets/icons/subjects_icon/Civic_icon.jpg
    - assets/icons/subjects_icon/Citizenship_icon.jpg
    - assets/icons/subjects_icon/Economics_icon.jpg
    - assets/icons/subjects_icon/Emerging_icon.jpg
    - assets/icons/subjects_icon/English_icon.jpg
    - assets/icons/subjects_icon/Geography_icon.jpg
    - assets/icons/subjects_icon/History_icon.jpg
    - assets/icons/subjects_icon/It_icon.jpg
    - assets/icons/subjects_icon/Logic_icon.jpg
    - assets/icons/subjects_icon/Math_icon.jpg
    - assets/icons/subjects_icon/Physics_icon.jpg
    - assets/icons/subjects_icon/Psychology_icon.jpg
    
    # Logos
    - assets/logos/
    - assets/logos/logo.png
    
    # Tutorial Videos (3 videos for 3 languages)
    - assets/videos/
    - assets/videos/tutorial_english.mp4
    - assets/videos/tutorial_amharic.mp4
    - assets/videos/tutorial_oromo.mp4

  # Fonts (if needed)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

# Flutter Gen Configuration
flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true
    flare_flutter: false
    rive: false
    lottie: false

  assets:
    enabled: true
    outputs:
      - assets/images/
      - assets/icons/
      - assets/icons/subjects_icon/
      - assets/logos/

  fonts:
    enabled: true

  colors:
    enabled: true
    inputs:
      - lib/core/constants/colors.dart